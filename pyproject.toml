[project]
name = "patchwise"
version = "0.1.0"
description = "Compuerta de evidencia para parches de seguridad generados por IA"
requires-python = ">=3.12"
dependencies = [
    "crosshair-tool>=0.0.113",
    "pytest>=8",
]

[project.scripts]
patchwise = "patchwise.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patchwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
